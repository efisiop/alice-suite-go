# Alice Suite - external PostgreSQL (e.g. Neon)
# DATABASE_URL is set manually in the Render Dashboard:
#   Dashboard → alice-suite-go → Environment → Add Environment Variable
#   key:   DATABASE_URL
#   value: <connection string from Neon, includes sslmode=require>
# Migrations run on startup (start.sh) before the server.

services:
  - type: web
    name: alice-suite-go
    runtime: go
    plan: free
    buildCommand: go mod download && CGO_ENABLED=1 go build -o bin/server ./cmd/server && CGO_ENABLED=1 go build -o bin/migrate ./cmd/migrate && CGO_ENABLED=1 go build -o bin/init-users ./cmd/init-users && CGO_ENABLED=1 go build -o bin/fix-render ./cmd/fix-render && CGO_ENABLED=1 go build -o bin/verify-deployment ./cmd/verify-deployment && CGO_ENABLED=1 go build -o bin/diagnose-sections ./cmd/diagnose-sections && CGO_ENABLED=1 go build -o bin/compare-db-structure ./cmd/compare-db-structure
    startCommand: ./start.sh
    envVars:
      - key: PORT
        value: 10000
      - key: ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      # DATABASE_URL is NOT set here on purpose — set it in the Render Dashboard
      # so you can point it at Neon (or any external Postgres) without editing code.
      # AI Provider Configuration
      # IMPORTANT: Set these as environment variables in Render Dashboard (not here!)
      # Go to: https://dashboard.render.com → Your Service → Environment → Add Environment Variable
      # - key: GEMINI_API_KEY
      #   sync: false  # Set this in Render Dashboard instead
      # - key: MOONSHOT_API_KEY
      #   sync: false  # Set this in Render Dashboard instead
      - key: AI_PROVIDER
        value: auto  # Options: "auto" (try Gemini first, fallback to Moonshot), "gemini", or "moonshot"