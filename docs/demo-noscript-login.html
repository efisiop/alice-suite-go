<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Demo: Login with JavaScript disabled message</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="card shadow">
                    <div class="card-body p-5">
                        <h2 class="card-title text-center mb-4">Consultant Login</h2>

                        <div id="error-message" class="alert alert-danger d-none" role="alert"></div>
                        <!-- This block is visible ONLY when JavaScript is disabled -->
                        <noscript>
                            <div class="alert alert-warning" role="alert">
                                <strong>JavaScript is disabled.</strong> Please enable JavaScript to use the login form.
                            </div>
                        </noscript>

                        <form id="login-form">
                            <div class="mb-3">
                                <label for="email" class="form-label">Email</label>
                                <input type="email" class="form-control" id="email" name="email" required>
                            </div>
                            <div class="mb-3">
                                <label for="password" class="form-label">Password</label>
                                <input type="password" class="form-control" id="password" name="password" required>
                            </div>
                            <div class="d-grid">
                                <button type="submit" class="btn btn-primary">Login</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
        <p class="text-muted text-center mt-3 small">
            To see the yellow warning: disable JavaScript in your browser, then reload this file.
        </p>
    </div>
</body>
</html>
