{{define "title"}}Administrator Login - Alice Suite{{end}}

{{define "head"}}
<style>
  /* Dark blue background, white text for contrast */
  body.admin-app .navbar-light { background-color: #1a365d !important; }
  body.admin-app .navbar-light .navbar-brand,
  body.admin-app .navbar-light .navbar-link { color: #ffffff !important; }
  body.admin-app main { background-color: #0d2137; color: #ffffff; }
  body.admin-app .btn-primary { background-color: #1a365d; border-color: #1a365d; }
  body.admin-app footer { background-color: #1a365d !important; color: #ffffff !important; }
  body.admin-app footer p { color: #ffffff !important; }
</style>
{{end}}

{{define "nav"}}
{{end}}

{{define "content"}}
<script>document.body.classList.add('admin-app');document.body.setAttribute('data-app','admin');</script>
<div class="admin-login-page row justify-content-center">
    <div class="col-md-5">
        <div class="card shadow">
            <div class="card-body p-5">
                <h2 class="card-title text-center mb-4">Administrator Login</h2>
                <p class="text-muted text-center small mb-4">Board & operations overview. Limited access.</p>

                <div id="error-message" class="alert alert-danger d-none" role="alert"></div>
                <noscript>
                    <div class="alert alert-warning" role="alert">
                        <strong>JavaScript is disabled.</strong> Please enable JavaScript to use the login form.
                    </div>
                </noscript>

                <form id="login-form" action="#" method="post">
                    <div class="mb-3">
                        <label for="email" class="form-label">Email</label>
                        <input type="email" class="form-control" id="email" name="email" required>
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label">Password</label>
                        <input type="password" class="form-control" id="password" name="password" required>
                    </div>
                    <div class="d-grid">
                        <button type="submit" class="btn btn-primary">Login</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{{end}}

{{define "scripts"}}
<script>
(function() {
  var path = window.location.pathname;
  if (path.indexOf('/admin') !== 0) {
    window.location.replace('/admin/login');
    return;
  }
  document.getElementById('login-form').addEventListener('submit', function(e) {
    e.preventDefault();
    var formData = new FormData(this);
    var data = {
      email: formData.get('email'),
      password: formData.get('password')
    };
    var errorEl = document.getElementById('error-message');
    var submitBtn = this.querySelector('button[type="submit"]');

    submitBtn.disabled = true;
    submitBtn.textContent = 'Logging in...';
    errorEl.classList.add('d-none');

    fetch('/auth/v1/token', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(data),
        redirect: 'manual'
    })
    .then(function(res) {
        if (res.type === 'opaqueredirect' || (res.status >= 300 && res.status < 400)) {
            errorEl.textContent = 'Login error. Stay on this page and try again.';
            errorEl.classList.remove('d-none');
            submitBtn.disabled = false;
            submitBtn.textContent = 'Login';
            return Promise.reject(new Error('Redirect not allowed'));
        }
        if (!res.ok) {
            return res.text().then(function(text) {
                var errorMsg = 'Login failed';
                try {
                    var errorData = JSON.parse(text);
                    errorMsg = errorData.error || errorData.message || 'Invalid email or password';
                } catch (e) {
                    if (res.status === 401) errorMsg = 'Invalid email or password';
                    else if (res.status === 500) errorMsg = 'Server error. Please try again later.';
                }
                throw new Error(errorMsg);
            });
        }
        return res.json();
    })
    .then(function(data) {
        if (data.access_token) {
            var token = data.access_token;
            sessionStorage.setItem('auth_token', token);

            try {
                var payload = JSON.parse(atob(token.split('.')[1]));
                var role = payload.role || payload.Role;
                if (role === 'administrator') {
                    window.location.replace('/admin');
                    return;
                }
                errorEl.textContent = 'This account is not an administrator. Access denied.';
                errorEl.classList.remove('d-none');
                submitBtn.disabled = false;
                submitBtn.textContent = 'Login';
            } catch (err) {
                errorEl.textContent = 'Invalid token. Please try again.';
                errorEl.classList.remove('d-none');
                submitBtn.disabled = false;
                submitBtn.textContent = 'Login';
            }
        } else {
            errorEl.textContent = 'Invalid response from server. Please try again.';
            errorEl.classList.remove('d-none');
            submitBtn.disabled = false;
            submitBtn.textContent = 'Login';
        }
    })
    .catch(function(err) {
        errorEl.textContent = err.message || 'Login failed. Please check your credentials.';
        errorEl.classList.remove('d-none');
        submitBtn.disabled = false;
        submitBtn.textContent = 'Login';
    });
});
})();
</script>
{{end}}
