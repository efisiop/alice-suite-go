{{define "title"}}Consultant Login - Alice Suite{{end}}

{{define "head"}}
<style>
body {
    background: var(--c-bg, linear-gradient(180deg, #f5f2ed 0%, #ede8e0 100%)) !important;
}

.consultant-login-card {
    border-radius: 16px;
    border: 1px solid var(--c-card-border, rgba(21, 87, 36, 0.12));
    box-shadow: 0 4px 20px var(--c-card-shadow, rgba(21, 87, 36, 0.08));
    overflow: hidden;
}

.consultant-login-card .card-header-themed {
    background: linear-gradient(135deg, var(--c-primary, #2d5a27), var(--c-primary-light, #3a7233));
    color: #fff;
    padding: 1.5rem 2rem;
    text-align: center;
}

.consultant-login-card .card-header-themed h2 {
    margin: 0;
    font-size: 1.4rem;
    font-weight: 600;
    color: #fff;
}

.consultant-login-card .card-header-themed p {
    margin: 0.3rem 0 0;
    font-size: 0.85rem;
    opacity: 0.8;
    color: #fff;
}

.consultant-login-card .card-body {
    background: var(--c-card-bg, linear-gradient(180deg, #fefefe, #faf8f5));
    padding: 2rem;
}

.consultant-login-card .form-control {
    border-radius: 8px;
    border: 2px solid #d4c9b8;
    padding: 0.6rem 1rem;
}

.consultant-login-card .form-control:focus {
    border-color: var(--c-primary-light, #3a7233);
    box-shadow: 0 0 0 0.2rem rgba(var(--c-primary-rgb, 45, 90, 39), 0.15);
}

.consultant-login-card .btn-primary {
    background: linear-gradient(135deg, var(--c-primary, #2d5a27), var(--c-primary-light, #3a7233));
    border: none;
    border-radius: 8px;
    padding: 0.65rem;
    font-weight: 600;
    font-size: 1rem;
}

.consultant-login-card .btn-primary:hover {
    background: linear-gradient(135deg, var(--c-primary-end, #245020), var(--c-primary, #2d5a27));
}
</style>
{{end}}

{{define "nav"}}
{{end}}

{{define "content"}}
<div class="row justify-content-center" style="margin-top: 3rem;">
    <div class="col-md-5">
        <div class="card consultant-login-card">
            <div class="card-header-themed">
                <h2>Consultant Login</h2>
                <p>Alice Suite reading support</p>
            </div>
            <div class="card-body">
                <div id="error-message" class="alert alert-danger d-none" role="alert"></div>
                <noscript>
                    <div class="alert alert-warning" role="alert">
                        <strong>JavaScript is disabled.</strong> Please enable JavaScript to use the login form.
                    </div>
                </noscript>

                <form id="login-form">
                    <div class="mb-3">
                        <label for="email" class="form-label fw-semibold">Email</label>
                        <input type="email" class="form-control" id="email" name="email" required>
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label fw-semibold">Password</label>
                        <input type="password" class="form-control" id="password" name="password" required>
                    </div>
                    <div class="d-grid">
                        <button type="submit" class="btn btn-primary">Log in</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{{end}}

{{define "scripts"}}
<script>
document.getElementById('login-form').addEventListener('submit', function(e) {
    e.preventDefault();
    const formData = new FormData(this);
    const data = {
        email: formData.get('email'),
        password: formData.get('password')
    };

    const errorEl = document.getElementById('error-message');
    const submitBtn = this.querySelector('button[type="submit"]');

    submitBtn.disabled = true;
    submitBtn.textContent = 'Logging in...';
    errorEl.classList.add('d-none');

    fetch('/auth/v1/token', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(data)
    })
    .then(res => {
        if (!res.ok) {
            return res.text().then(text => {
                let errorMsg = 'Login failed';
                try {
                    const errorData = JSON.parse(text);
                    errorMsg = errorData.error || errorData.message || 'Invalid email or password';
                } catch (e) {
                    if (res.status === 401) {
                        errorMsg = 'Invalid email or password';
                    } else if (res.status === 500) {
                        errorMsg = 'Server error. Please try again later.';
                    }
                }
                throw new Error(errorMsg);
            });
        }
        return res.json();
    })
    .then(data => {
        if (data.access_token) {
            const token = data.access_token;
            sessionStorage.setItem('auth_token', token);

            try {
                const payload = JSON.parse(atob(token.split('.')[1]));

                if (payload.role === 'consultant') {
                    setTimeout(() => {
                        window.location.href = '/consultant';
                    }, 200);
                } else {
                    errorEl.textContent = 'This account is not a consultant account. Redirecting...';
                    errorEl.classList.remove('d-none');
                    setTimeout(() => {
                        window.location.href = '/reader';
                    }, 2000);
                }
            } catch (err) {
                setTimeout(() => {
                    window.location.href = '/consultant';
                }, 200);
            }
        } else {
            errorEl.textContent = 'Invalid response from server. Please try again.';
            errorEl.classList.remove('d-none');
            submitBtn.disabled = false;
            submitBtn.textContent = 'Log in';
        }
    })
    .catch(err => {
        errorEl.textContent = err.message || 'Login failed. Please check your credentials and try again.';
        errorEl.classList.remove('d-none');
        submitBtn.disabled = false;
        submitBtn.textContent = 'Log in';
    });
});
</script>
{{end}}
